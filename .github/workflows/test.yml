name: Test with Busted
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - lua/*.lua
      - lua/triforce/*.lua
      - lua/triforce/ui/*.lua
      - spec/*.lua
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - lua/*.lua
      - lua/triforce/*.lua
      - lua/triforce/ui/*.lua
      - spec/*.lua
    types:
      - opened
      - ready_for_review
jobs:
  sile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0
